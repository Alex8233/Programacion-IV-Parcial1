<form (ngSubmit)="onSubmit()" #loginform = "ngForm">
    <div class = "mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="email" required email #emailField="ngModel">
        @if(emailField.invalid && emailField.touched){
            <div class="text-danger small">Correo Invalido</div>
        }
    </div>
    <div class = "mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control"name="email" [(ngModel)]="password" required minlength="6" #passField="ngModel">
        @if(passField.invalid && passField.touched){
            <div class="text-danger small">Minimo 6 caracteres</div>
        }
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="loginform.invalid"> Ingresar</button>
 
</form>
