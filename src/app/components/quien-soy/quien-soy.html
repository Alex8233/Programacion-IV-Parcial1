@if (user()) {
    <div class="card p-3">
      <img [src]="user().avatar_url" width="150">
  
      <h2>{{ user().name }}</h2>
      <p><strong>Usuario:</strong> {{ user().login }}</p>
      <p><strong>Bio:</strong> {{ user().bio }}</p>
      <p><strong>Repos públicos:</strong> {{ user().public_repos }}</p>
    </div>
  }
